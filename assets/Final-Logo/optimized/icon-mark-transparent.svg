<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-270 -270 540 540" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Temples of Refuge">
  <title>Temples of Refuge</title>
  <desc>Reduced Seed of Life mark, optimized for small sizes on light backgrounds.</desc>
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5FC2"/>
      <stop offset="100%" stop-color="#3F1E66"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0CE7B"/>
      <stop offset="100%" stop-color="#B8862E"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4A8"/>
      <stop offset="55%" stop-color="#E8C268"/>
      <stop offset="100%" stop-color="#B8862E"/>
    </radialGradient>
  </defs>

  <!-- Bold outer ring -->
  <circle cx="0" cy="0" r="245" stroke="url(#goldGrad)" stroke-width="9"/>

  <!-- Seed of Life: 7 heavy violet circles -->
  <g stroke="url(#violetGrad)" stroke-width="11" stroke-linejoin="round">
    <circle cx="0"    cy="0"       r="100"/>
    <circle cx="100"  cy="0"       r="100"/>
    <circle cx="50"   cy="86.603"  r="100"/>
    <circle cx="-50"  cy="86.603"  r="100"/>
    <circle cx="-100" cy="0"       r="100"/>
    <circle cx="-50"  cy="-86.603" r="100"/>
    <circle cx="50"   cy="-86.603" r="100"/>
  </g>

  <!-- Glowing gold center -->
  <circle cx="0" cy="0" r="30" fill="url(#centerGlow)"/>
  <circle cx="0" cy="0" r="9"  fill="#FFF4D6"/>
</svg>
